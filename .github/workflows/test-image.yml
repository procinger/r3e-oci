name: E2E Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Build and test web UI
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TEST_IMAGE: raceroom:pr-test
      CONTAINER_NAME: raceroom-pr-test
      # Test credentials only; no repository secrets are needed for pull requests.
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-smoke-test-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start RaceRoom
        shell: bash
        run: |
          security_options=()
          docker_version=$(docker version --format '{{.Server.Version}}')
          echo "Docker Engine: $docker_version"

          # Docker 29.4.2 blocks the socketcall syscall used by 32-bit SteamCMD.
          # Use Docker's recommended profile for this version only.
          # https://docs.docker.com/engine/release-notes/29/#2942
          if [[ "$docker_version" == 29.4.2 || "$docker_version" == 29.4.2-* ]]; then
            profile="$RUNNER_TEMP/steamcmd-seccomp.json"
            curl --fail --silent --show-error --location --retry 3 \
              https://raw.githubusercontent.com/moby/profiles/refs/tags/seccomp/v0.2.1/seccomp/default.json \
              --output "$profile"
            security_options+=(--security-opt "seccomp=$profile")
          fi

          docker run --detach --tty \
            "${security_options[@]}" \
            --name "$CONTAINER_NAME" \
            --env ADMIN_USERNAME \
            --env ADMIN_PASSWORD \
            --publish 127.0.0.1:18088:8080 \
            "$TEST_IMAGE"

      - name: Wait for HTTP 200 from the web UI
        timeout-minutes: 12
        shell: bash
        run: |
          # SteamCMD downloads RaceRoom on first startup; allow up to ten minutes.
          deadline=$((SECONDS + 600))
          while ((SECONDS < deadline)); do
            if [[ $(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME") != true ]]; then
              echo 'RaceRoom exited before the web UI became available.' >&2
              docker inspect --format '{{json .State}}' "$CONTAINER_NAME"
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 2 --max-time 5 \
              --user "$ADMIN_USERNAME:$ADMIN_PASSWORD" \
              http://127.0.0.1:18088/ || true)

            if [[ "$status" == 200 ]]; then
              echo 'Web UI returned HTTP 200.'
              exit 0
            fi

            echo "Waiting for the web UI (HTTP ${status})..."
            sleep 5
          done

          echo 'Timed out waiting for HTTP 200 from the web UI.' >&2
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: |
          docker inspect --format '{{json .State}}' "$CONTAINER_NAME" || true
          docker logs "$CONTAINER_NAME" || true

      - name: Remove test container
        if: always()
        run: docker rm --force --volumes "$CONTAINER_NAME" || true
