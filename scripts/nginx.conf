pid /tmp/raceroom-nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;

    # All temporary files must be writable by UID 1000.
    client_body_temp_path /tmp/raceroom-client;
    proxy_temp_path /tmp/raceroom-proxy;
    fastcgi_temp_path /tmp/raceroom-fastcgi;
    uwsgi_temp_path /tmp/raceroom-uwsgi;
    scgi_temp_path /tmp/raceroom-scgi;

    # Preserve WebSocket upgrades used by the administration interface.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;

        location / {
            include /tmp/raceroom-admin-auth.conf;

            proxy_pass http://127.0.0.1:8088;
            proxy_http_version 1.1;
            # RaceRoom only accepts its local administration hostname.
            proxy_set_header Host localhost:8088;
            # Credentials are checked here and must not reach the Raceroom backend.
            proxy_set_header Authorization "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
